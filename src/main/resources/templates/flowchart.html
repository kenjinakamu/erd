<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Java → Mermaid Flowchart</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="sequence-page flowchart-page">
<main class="container">
    <header>
        <nav class="top-nav">
            <a href="/">SQL → ER図</a>
            <a href="/sequence">Java → シーケンス図</a>
            <a href="/flowchart" class="active">Java → フローチャート</a>
        </nav>
        <h1>Spring Java → Mermaid Flowchart</h1>
        <p>Javaソースのディレクトリを指定し、ControllerとEndpointを選択して、Endpoint内のIF文・SWITCH文を解析した縦方向のフローチャートを生成します。繰り返し構造はフローとして表現しません。</p>
    </header>

    <section class="panel">
        <label for="sourcePath">Javaソースのパス</label>
        <input id="sourcePath" class="text-input" type="text" spellcheck="false"
               placeholder="例: /workspace/my-app/src/main/java または C:\work\my-app\src\main\java">
        <div class="actions">
            <button id="scanButton" class="primary">Controller一覧を取得</button>
        </div>
        <div id="scanErrorBox" class="message error hidden"></div>
        <div id="scanWarningBox" class="message warning hidden"></div>
    </section>

    <section class="panel">
        <label for="controllerSelect">Controller</label>
        <select id="controllerSelect" class="text-input" disabled>
            <option value="">先にJavaソースのパスを読み込んでください</option>
        </select>

        <label for="endpointSelect">Endpoint</label>
        <select id="endpointSelect" class="text-input" disabled>
            <option value="">先にControllerを選択してください</option>
        </select>

        <div id="endpointBox" class="message info hidden"></div>
        <div class="actions">
            <button id="flowchartButton" class="primary" disabled>フローチャート作成</button>
        </div>
        <div id="generateErrorBox" class="message error hidden"></div>
        <div id="generateWarningBox" class="message warning hidden"></div>
    </section>

    <section class="panel">
        <div class="section-title">
            <h2>Mermaid</h2>
            <div class="actions compact">
                <button id="copyButton" class="secondary" disabled>コピー</button>
            </div>
        </div>
        <textarea id="mermaidText" class="mermaid-text" spellcheck="false" readonly></textarea>
    </section>

    <section class="panel">
        <h2>プレビュー</h2>
        <div id="preview" class="preview empty">Endpointを選択してフローチャートを作成するとここに表示されます。</div>
    </section>
</main>
<script type="module" src="/js/flowchart.js?v=20260910-3"></script>
</body>
</html>
